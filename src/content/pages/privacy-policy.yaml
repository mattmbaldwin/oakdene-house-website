layout: privacy-policy
seo:
  title: Privacy Policy — Oakdene House Foundation
  description: Oakdene House Foundation Privacy Policy — how we collect, use, store and protect your personal information in accordance with the Privacy Act 1988 and the Australian Privacy Principles.
hero:
  breadcrumb: Privacy Policy
  heading: Privacy Policy
notice:
  label: Client Privacy Notice
  text: Your privacy matters to us. Please read this notice before we begin.
version: 'Version: April 2026'
sections:
  - heading: Who we are
    blocks:
      - paragraph: We are Oakdene House Foundation, a charity based in Fairfield, Western Sydney. We support people and families who are going through hard times ,including those affected by addiction, hardship, homelessness, and other challenges.
      - paragraph: When you use our services, we need to collect some information about you. This notice explains what we collect, why we collect it, and how we keep it safe.
      - paragraph: If you have questions about any of this, please ask one of our staff. We are happy to explain things in more detail or in a different language.
  - heading: What information do we collect?
    blocks:
      - paragraph: 'We collect information to help us support you properly. This may include:'
      - items:
          - Your name, address, phone number, and email address
          - Your date of birth
          - Information about your situation and the support you need
          - Health and wellbeing information, where it is relevant to your support
          - Emergency contact details
          - Information from referral forms completed by other services on your behalf
      - callout:
          heading: About health information
          lines:
            - Some of the information we collect ,such as details about your physical or mental health, alcohol or drug use, or disability ,is called sensitive or health information. This type of information has extra protections under Australian law. We treat it with the highest level of care and confidentiality.
  - heading: Using our website
    blocks:
      - paragraph: Videos on our website are hosted on YouTube. We use YouTube's privacy-enhanced mode, so nothing loads from YouTube until you press play. Once you play a video, Google handles your information under its own privacy policy.
      - paragraph: We use Google Analytics, run through Cloudflare, to understand how our website is used, such as which pages are visited and how often our video is played. It does not collect your name or contact details, and we use what it tells us only to improve our website. You can turn it off with your browser's privacy settings or a content blocker.
  - heading: Why do we collect this information?
    blocks:
      - paragraph: 'We use your information to:'
      - items:
          - Understand what support you need
          - Provide you with services, counselling, and programs
          - Connect you with other services and supports that may help
          - Keep our records up to date and accurate
          - Meet our legal obligations as a registered charity
          - Report to our funders (usually in a way that does not identify you personally)
      - paragraph: We only collect information that we actually need. We will not ask for information that is not relevant to your support.
  - heading: Who can see your information?
    blocks:
      - paragraph: 'Your information is only seen by people who need it to help you. This may include:'
      - items:
          - Oakdene staff and volunteers directly involved in your support
          - Other organisations we refer you to ,but only with your permission
          - Government agencies or courts, if we are legally required to share information
      - callout:
          heading: We will not share your information without your permission except in limited situations
          lines:
            - There are some situations where we may need to share information without asking you first ,for example, if we believe your life or someone else's life is at serious risk. We will always try to discuss this with you first where we can.
      - paragraph: We do not sell your information to anyone. We do not share it for advertising or marketing purposes.
  - heading: Is my information confidential?
    blocks:
      - paragraph: Yes. Everything you share with us is treated as confidential. Our staff are bound by confidentiality obligations and understand how important this is.
      - paragraph: 'There are a small number of situations where we may be required to share information. These are:'
      - items:
          - If we believe you or someone else is at serious risk of harm
          - If we are required to by a court order or other law
          - If you have given us permission to share your information with a specific person or service
      - paragraph: In these situations, we will always try to let you know first, unless doing so would put someone at risk.
  - heading: What are your rights?
    blocks:
      - paragraph: 'You have the right to:'
      - items:
          - Ask to see the information we hold about you
          - Ask us to correct information that is wrong or out of date
          - Ask us to keep some or all of your information private from certain people
          - Withdraw your consent to share your information at any time
          - Make a complaint if you feel your privacy has not been respected
      - paragraph: To exercise any of these rights, please speak with a staff member or contact our Privacy Officer directly (contact details are at the end of this notice).
  - heading: Can I stay anonymous?
    blocks:
      - paragraph: In some cases, you can access information or ask general questions without telling us who you are. However, if you want to use our support services, we will usually need to know some information about you so that we can help safely and effectively.
      - paragraph: If you have concerns about giving us your name or other details, please talk to us. We will do our best to support you in a way that you are comfortable with.
  - heading: How do we keep your information safe?
    blocks:
      - paragraph: 'We take your privacy seriously. We keep your information safe by:'
      - items:
          - Storing paper records securely and limiting who can access them
          - Using secure electronic systems with password protection
          - Only allowing staff to access information they need for their role
          - Training our team on how to handle information responsibly
          - Disposing of records securely when we no longer need them
  - heading: How long do we keep your information?
    blocks:
      - paragraph: We keep your information for as long as the law requires or as long as it is needed to support you. For most client records, this is at least seven years. For records relating to children or young people, we may keep information for longer.
      - paragraph: When we no longer need your information, we destroy or de-identify it safely so that it cannot be traced back to you.
  - heading: What if I have a concern or complaint?
    blocks:
      - paragraph: 'If you are unhappy about the way we have handled your information, please talk to us. You can:'
      - items:
          - Speak with a staff member directly
          - Contact our Privacy Officer (details below)
          - 'Contact the Office of the Australian Information Commissioner (OAIC): 1300 363 992 or [www.oaic.gov.au](https://www.oaic.gov.au){new}'
          - 'Contact the NSW Privacy Commissioner: 1800 472 679 or [www.ipc.nsw.gov.au](https://www.ipc.nsw.gov.au){new}'
      - paragraph: We take all privacy concerns seriously and will respond promptly.
