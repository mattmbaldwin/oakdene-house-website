seo:
  title: About Oakdene House Foundation
  description: Oakdene House Foundation is a Western Sydney charity supporting
    people and families affected by addiction, hardship and homelessness through
    practical help, counselling and community connection.
  image: /images/centre/exterior-exterior-1-img_2651.jpg
