layout: used-clothing-store
seo:
  title: Used Clothing Store — Oakdene House Foundation
  description: Free men's and women's clothing, shoes and accessories at Oakdene's Used Clothing Store, inside the Laundrette at 1 Dale Street, Fairfield.
  image: /images/boutique/boutique-interior-clothing-rack.jpg
hero:
  breadcrumb: Used Clothing Store
  heading: Oakdene Used Clothing Store
  lead: Free clothing for people doing it tough.
intro:
  heading:
    eyebrow: The Service
    heading: Clothing with dignity
  paragraphs:
    - The Oakdene Used Clothing Store offers free men's and women's clothing, shoes, and accessories to people experiencing hardship. The store is located inside our Laundrette at 1 Dale Street, Fairfield.
    - We believe access to clean, decent clothing is a basic necessity, and we are here to help without judgment.
  guidelinesHeading: Visit guidelines
  guidelines:
    - 3 items per visit
    - One visit per month
    - Clothing cannot be tried on
    - No returns once taken
    - One person in the room at a time
    - Door must remain open
    - Access will be managed by the staff onsite
    - Items are not available by request and based on donations received
  details:
    caption: Service details
    hoursLabels:
      days: Days
      hours: Hours
    rows:
      - label: Location
        value: Inside the Laundrette, 1 Dale Street, Fairfield
      - label: Cost
        value: Free
      - label: Email
        value: "[kitchen@oakdenehouse.org.au](mailto:kitchen@oakdenehouse.org.au)"
      - label: Phone
        value: "[0415 156 100](tel:0415156100)"
  eligibility:
    heading: Eligibility
    text: The same eligibility applies as the Oakdene Kitchen and Laundrette — a current Centrelink Income Statement and photo ID showing income under $1,200 per fortnight.
