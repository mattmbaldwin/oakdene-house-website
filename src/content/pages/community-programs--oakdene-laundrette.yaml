      - label: Phone
        value: "[0415 156 100](tel:0415156100)"
photos:
  - src: /images/laundrette/laundrette-interior-3-washing-machines.jpg
    alt: Washing machines inside the Oakdene Laundrette
  - src: /images/laundrette/laundrette-interior-1-with-people.jpg
    alt: Inside the Oakdene Laundrette
  - src: /images/laundrette/anthony-sobb-oakdene-laundrette-1.jpg
