hero:
  breadcrumb: Oakdene Laundrette
  heading: Oakdene Laundrette
  lead: A free community laundry service for people doing it tough.
intro:
  heading:
    eyebrow: The Service
    heading: Clean clothes, no cost
  paragraph: The Oakdene Laundrette provides free laundry facilities for people experiencing hardship. Whether it's a temporary situation or ongoing difficulty, everyone deserves clean clothes.
  includedHeading: What's included each visit
  includedItems:
    - One load of washing
    - One load of drying
    - Laundry detergent provided
    - A clean, private space
    - Support from staff or volunteers
  details:
    caption: Service details
    hoursLabels:
      days: Days
      hours: Hours
      lastEntry: Last entry
    rows:
      - label: Location
        value: 1 Dale Street, Fairfield
      - label: Cost
        value: Free
      - label: Email
