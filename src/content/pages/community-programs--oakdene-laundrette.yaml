how:
  heading:
    eyebrow: Your Visit
    heading: How it works
  steps:
    - Check in with staff or security on arrival
    - Receive a washing tablet and number tag matching your machine
    - Load your clothes, place the tablet in the drum and press Start
    - When the wash finishes, move items to the dryer
    - Stay nearby while cycles run — visit Oakdene Kitchen while you wait
    - Return your number tag when finished
  eligibility:
    heading: Eligibility
    text: The same eligibility applies as the Oakdene Kitchen. Bring a current Centrelink Income Statement and photo ID. Your statement must show income under **$1,200 per fortnight**.
group:
  heading:
    eyebrow: For Organisations
    heading: Group laundry bookings
  text: We offer group laundry bookings outside public hours, available {hours}, for non-profits supporting homelessness, shelters, and group homes.
  points:
    - Must be booked by a support worker who attends in person
    - 2-hour sessions
    - 4 professional-grade machines available
    - Detergent provided — free of charge
  button:
    label: Book a Session
    href: /contact/
