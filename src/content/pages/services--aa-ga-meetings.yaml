about:
  heading:
    eyebrow: About the Programs
    heading: 12-step peer support
  cards:
    - heading: Alcoholics Anonymous (AA)
      paragraphs:
        - AA is a fellowship of people who share their experience, strength and hope with each other to solve their common problem and help others to recover from alcoholism. Membership is open to anyone with a desire to stop drinking.
        - We host both English and Spanish-speaking AA meetings at Oakdene.
    - heading: Gamblers Anonymous (GA)
      paragraphs:
        - GA is a fellowship of people who share their experience, strength and hope with each other so they may solve their common problem and help others to recover from a gambling problem.
        - GA meetings provide a structured peer environment built on the 12-step model of recovery.
