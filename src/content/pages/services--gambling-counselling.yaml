impact:
  heading:
    eyebrow: How We Help
    heading: Understanding the impact of gambling
    lead: Gambling can affect every part of a person's life. Our counsellors work with you across all of it.
  items:
    - heading: Financial pressure
      body: Debt, loss of income, and financial instability are common consequences. Counselling helps you understand your options and plan ahead. Our [Financial Counselling](/services/financial-counselling/) service can also help with gambling-related financial harm, debt, and money stress.
    - heading: Relationships
      body: Gambling can strain family and personal relationships. We support honest conversations and rebuilding trust.
    - heading: Mental wellbeing
      body: Shame, anxiety and depression often accompany problem gambling. Counselling provides a space to process these experiences.
    - heading: Recovery planning
      body: We help you identify goals, build strategies and develop a personalised path forward.
cta:
