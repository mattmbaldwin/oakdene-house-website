  title: Gambling Counselling — Oakdene House Foundation
  description: Free, confidential gambling counselling at Oakdene House, provided by Catholic Care. By appointment. Fairfield, Western Sydney.
  image: /images/generic/bandw-distressed-woman.jpeg
hero:
  breadcrumb: Gambling Counselling
  heading: Gambling Counselling
  lead: Free, confidential one-on-one counselling for people affected by gambling.
overview:
  heading:
    eyebrow: About this service
    heading: Support without judgment
  paragraphs:
    - Oakdene offers free, confidential one-on-one gambling counselling delivered by our team. Our counsellors are specially trained and experienced in addiction counselling, supporting people affected by gambling and helping them work through their challenges with dignity and respect.
    - Counselling is delivered by appointment on a one-to-one basis. All conversations are confidential and non-judgmental.
  facts:
