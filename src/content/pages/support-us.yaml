# Words and images for /support-us/. Layout: src/pages/support-us.astro. The donation box is GiveNow's and is not edited here.
layout: support-us
seo:
  title: Support Oakdene House
  description: Help Oakdene House provide practical, dignified support to people and families facing addiction, hardship and homelessness in Sydney. Donations of $2 or more are tax-deductible.
  image: /images/hero/hero-support-us.png
hero:
  heading: Your support changes real lives
  subheading: Every donation to Oakdene House goes directly into practical support for people and families in our community. Whether you give once or become a monthly supporter, your contribution helps someone take the next step.
  image:
    src: /images/hero/hero-support-us.png
    alt: Community members supported by Oakdene House Foundation
  buttons: []
intro:
  srHeading: About your donation
  text: Oakdene House Foundation has been part of Sydney's recovery community for over 30 years. We provide free counselling, transitional housing, and community programs to people and families facing addiction, hardship and homelessness. Your donation keeps those services running.
