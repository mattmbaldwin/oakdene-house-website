    href: "#referral-form"
  secondary:
    label: Make an Enquiry
    href: /contact/
intro:
  heading:
    eyebrow: About the Boutique
    heading: Support for women, by women
  paragraphs:
    - The Oakdene Ladies Boutique is a warm, private and supportive space designed for women who are doing it tough. We offer more than just clothing — we offer an experience that treats women with dignity and care.
    - Access is by referral only.
  motto: Support for Women by Women
  details:
    caption: Service details
    rows:
      - label: Days
        value: By appointment only
      - label: Hours
        value: By appointment only
      - label: Access
        value: By appointment only
      - label: Cost
        value: Gold Coin Donation
      - label: Email
        value: "[boutique@oakdenehouse.org.au](mailto:boutique@oakdenehouse.org.au)"
      - label: Phone
        value: "[0415 156 100](tel:0415156100)"
offerings:
  heading:
    eyebrow: What We Offer
    heading: Everything in one welcoming space
  cards:
    - heading: Clothing Hub
      description: A real shopping experience with quality clothing and accessories selected with care.
    - heading: Salon Services
      description: Professional wash, cut, and blow-dry. No colouring or styling.
    - heading: Private Space
      description: A private fitting space where you can browse and try items in comfort.
    - heading: Community
      description: Connection with other women and staff in a supportive environment.
