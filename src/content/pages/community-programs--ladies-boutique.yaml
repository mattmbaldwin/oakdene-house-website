eligibility:
  heading:
    eyebrow: Who Can Access
    heading: Eligibility and access
  automatic:
    heading: Automatic eligibility
    intro: "You are automatically eligible if you meet any of these:"
    items:
      - Receiving Centrelink under $1,200/fortnight **and** hold a concession card
      - You have been referred by a service or professional
      - You are in crisis
  stress:
    heading: Financial stress assessment
    intro: "We will chat with you if 2 or more of these apply:"
    items:
      - Behind on rent
      - Skipping meals
      - 3 or more children
      - Disability caring burden
      - Limited disposable income
  visitNote: Maximum **2 visits per 12 months per household**. Emergency override possible with staff approval.
  how:
    heading: How to access
    text: You can be referred from services, health professionals, schools, or DV services. Referral only.
  promise:
    heading: Our access promise
    text: We believe in access. If cost is a barrier, please speak with us. **No woman will be turned away due to financial difficulty.**
referral:
  heading:
    eyebrow: Make a Referral
    heading: Submit a referral
cta:
  heading: Ready to visit or make a referral?
  primary:
    label: Submit Referral
    href: "#referral-form"
  secondary:
    label: Make an Enquiry
    href: /contact/
