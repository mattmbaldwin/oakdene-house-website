sections:
  - id: section-1
    heading: 1. Acceptance of Terms
    blocks:
      - paragraph: These Terms of Use (Terms) govern your access to and use of the Oakdene House Foundation website located at oakdenehouse.org.au and any associated pages or digital content (the Website).
      - paragraph: By accessing or using the Website, you acknowledge that you have read, understood, and agree to be bound by these Terms. If you do not agree to these Terms, you must not access or use the Website.
      - paragraph: These Terms apply to all visitors, users, and anyone who accesses or uses the Website.
  - id: section-2
    heading: 2. About Oakdene House Foundation
    blocks:
      - paragraph: 'Oakdene House Foundation (ABN: 90 151 950 926) is a registered Australian charity based in Fairfield, Western Sydney.'
      - paragraph: We support individuals and families affected by addiction, hardship, homelessness, and other life challenges through counselling, community programs, practical assistance, referral pathways, and related support services.
      - paragraph: Our Website is operated for community information and support access purposes. It is not a commercial platform and does not operate for profit.
  - id: section-3
    heading: 3. Permitted Use of the Website
    blocks:
      - paragraph: 'You may access and use the Website for personal, non-commercial purposes only, including to:'
      - items:
          - Learn about our services and programs
          - Submit enquiries, referrals, or support requests
          - Access publicly available resources and information
          - Contact our organisation
      - paragraph: 'You must not use the Website to:'
      - items:
          - Engage in any conduct that is unlawful, harmful, threatening, abusive, harassing, defamatory, or otherwise objectionable
          - Transmit, distribute, or post any material that infringes the intellectual property rights of any person
          - Attempt to gain unauthorised access to any part of the Website, our systems, or any related networks
          - Introduce viruses, malware, or other harmful code
          - Use automated tools (such as bots or scrapers) to access, collect, or monitor Website content without our prior written consent
          - Impersonate any person or entity, or misrepresent your affiliation with any person or entity
          - Collect, record, or use personal information about other users of the Website in a manner inconsistent with applicable privacy laws
          - Use the Website in a manner that could damage, disable, overburden, or impair its functionality
  - id: section-4
    heading: 4. Website Content — General Information Only
    blocks:
      - paragraph: 'The content on our Website is provided for general information and community access purposes only. It is not intended to constitute, and does not constitute:'
      - items:
          - Professional medical, health, mental health, or clinical advice
          - Legal or financial advice
          - A substitute for professional counselling or therapeutic services
      - paragraph: Whilst we endeavour to keep the information on our Website accurate and current, Oakdene House Foundation makes no representations or warranties of any kind, express or implied, regarding the completeness, accuracy, reliability, suitability, or availability of the information, products, services, or related graphics on the Website.
      - paragraph: If you are in crisis or require immediate support, please contact emergency services on 000 or a crisis helpline such as Lifeline on 13 11 14.
  - id: section-5
    heading: 5. Intellectual Property
    blocks:
      - paragraph: All content on this Website, including but not limited to text, graphics, logos, images, icons, and software, is the property of Oakdene House Foundation or its content suppliers and is protected by Australian copyright law.
      - paragraph: 'You may:'
      - items:
          - View, download, and print Website content for your personal, non-commercial use
          - Share links to our Website content on social media or other platforms
      - paragraph: 'You must not, without our prior written consent:'
      - items:
          - Reproduce, republish, distribute, sell, or commercially exploit any content from our Website
          - Use our name, logo, or branding in any way that suggests affiliation, endorsement, or sponsorship
          - Remove or alter any copyright, trademark, or other proprietary notices
  - id: section-6
    heading: 6. Third-Party Links and Resources
    blocks:
      - paragraph: Our Website may contain links to external websites and resources operated by third parties, including government agencies, community service providers, and referral partners. These links are provided for your convenience and information only.
      - paragraph: Oakdene House Foundation does not control, endorse, or accept responsibility for the content, privacy practices, or availability of any third-party websites. We encourage you to review the terms of use and privacy policies of any external sites you visit.
  - id: section-7
    heading: 7. Online Forms and User Submissions
    blocks:
      - paragraph: 'Our Website includes online forms for enquiries, referrals, volunteer applications, and program interest. By submitting a form, you confirm that:'
      - items:
          - The information you provide is accurate and complete to the best of your knowledge
          - You are authorised to provide the information submitted
          - You consent to us using that information in accordance with our Privacy Policy
      - paragraph: We reserve the right to decline, disregard, or not respond to any submission that is abusive, inappropriate, or otherwise contrary to these Terms.
      - paragraph: Submission of an online form does not guarantee the provision of any particular service. Our team will be in contact to discuss your needs and available options.
  - id: section-8
    heading: 8. Privacy
    blocks:
      - paragraph: Your use of the Website and any personal information you provide to us is governed by our Privacy Policy, which is incorporated into and forms part of these Terms. Our Privacy Policy explains how we collect, use, and protect your personal information in accordance with the Privacy Act 1988 (Cth), the Australian Privacy Principles (APPs), and the Health Records and Information Privacy Act 2002 (NSW) (HRIP Act).
      - paragraph: We treat personal information about our clients, donors, and community members with the highest degree of respect and confidentiality. We do not use personal information for direct marketing without consent, and we do not sell or trade personal information to third parties.
      - paragraph: Please review our [Privacy Policy](/privacy-policy/), which is available on our Website.
  - id: section-9
    heading: 9. Limitation of Liability
    blocks:
      - paragraph: 'To the maximum extent permitted by law, Oakdene House Foundation, its officers, employees, volunteers, and agents exclude all liability for any loss or damage (including consequential loss) arising from:'
      - items:
          - Your use of, or reliance on, the content or services available through the Website
          - Any interruption, suspension, or unavailability of the Website
          - Any errors, omissions, or inaccuracies in Website content
          - Unauthorised access to, or alteration of, your data or transmissions
          - Any content or conduct of third parties accessible through the Website
      - paragraph: Nothing in these Terms limits or excludes any rights or guarantees that cannot be excluded under the Australian Consumer Law or any other applicable law.
  - id: section-10
    heading: 10. Privacy and Serious Invasions of Privacy
    blocks:
      - paragraph: In addition to our obligations under the Privacy Act and these Terms, please note that from 10 June 2025, Australian law recognises a tort of serious invasion of privacy. This means individuals may have a cause of action where personal information about them has been collected, used, or disclosed in a way that seriously and intentionally or recklessly invades their privacy, and where their reasonable expectation of privacy was not respected.
      - paragraph: Oakdene House Foundation is committed to handling all personal information, including information submitted through this Website, in a manner that respects privacy and complies with all applicable laws. If you have concerns about how your personal information has been handled, please contact our Privacy Officer in the first instance.
  - id: section-11
    heading: 11. Website Availability
    blocks:
      - paragraph: We aim to make our Website available at all times, but we do not guarantee that the Website will be continuously available or free from errors. We may suspend, withdraw, or restrict access to some or all of the Website at any time without notice for operational, maintenance, or security reasons.
  - id: section-12
    heading: 12. Children and Vulnerable Persons
    blocks:
      - paragraph: Our Website is intended for use by adults and by service providers, carers, or family members seeking information on behalf of others. Our Website is not directed at children under the age of 18.
      - paragraph: If you are accessing our services on behalf of a child or a person who may be vulnerable, please contact us directly so that we can ensure that appropriate safeguards and support processes are in place. We apply additional care when collecting information about or on behalf of children, young people, or persons with compromised capacity to consent, and we may require involvement of a parent, guardian, or responsible person.
  - id: section-13
    heading: 13. Indemnity
    blocks:
      - paragraph: 'By using our Website, you agree to indemnify and hold harmless Oakdene House Foundation, its officers, employees, volunteers, and agents from and against any claims, liabilities, damages, losses, and expenses (including reasonable legal fees) arising out of or in any way connected with:'
      - items:
          - Your access to or use of the Website
          - Your breach of these Terms
          - Any content you submit through the Website
          - Your violation of any applicable law or the rights of any third party
  - id: section-14
    heading: 14. Governing Law
    blocks:
      - paragraph: These Terms are governed by the laws of New South Wales, Australia. Any disputes arising under or in connection with these Terms shall be subject to the exclusive jurisdiction of the courts of New South Wales.
  - id: section-15
    heading: 15. Changes to These Terms
    blocks:
      - paragraph: These Terms of Use were last updated in April 2026. We may update these Terms from time to time to reflect changes in our Website, services, or applicable law. Changes will take effect from the date they are published on the Website. Your continued use of the Website after any changes constitutes your acceptance of the updated Terms.
      - paragraph: We encourage you to review these Terms periodically.
  - id: section-16
    heading: 16. Contact Us
    blocks:
      - paragraph: 'If you have any questions or concerns about these Terms, please contact us:'
      - contactCard:
          heading: Oakdene House Foundation
          lines:
            - 'Address: 29 Vine St, Fairfield NSW 2165'
            - 'Email: [admin@oakdenehouse.org.au](mailto:admin@oakdenehouse.org.au)'
            - 'Phone: [02 8717 0999](tel:0287170999)'
            - 'Website: [www.oakdenehouse.org.au](https://www.oakdenehouse.org.au){new}'
      - paragraph: These Terms of Use should be read together with our Privacy Policy. Both documents are available on our Website.
