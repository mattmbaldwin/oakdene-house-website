intro:
  heading:
    eyebrow: About the Kitchen
    heading: A welcoming meal and a friendly face
  paragraph: The Oakdene Kitchen provides free hot lunches to people doing it tough. We believe everyone deserves access to a warm, nutritious meal in a safe environment — and a chance to connect with others.
  whoLabel: Who it's for
  whoText: People experiencing food insecurity, on low income, homeless or at risk, or anyone doing it tough.
  offerHeading: What we offer
  offerItems:
    - Free hot lunch
    - Friendly, safe space to eat together
    - Connection with staff, volunteers and community supports
    - Information about other Oakdene programs
  details:
    caption: Service details
    hoursLabels:
      days: Days
      hours: Hours
    rows:
      - label: Location
        value: 9/2 Dale Street, Fairfield
