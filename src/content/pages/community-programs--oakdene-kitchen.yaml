      - label: Phone
        value: "[0415 156 100](tel:0415156100)"
  motto: '"Feed the people, stay alive"'
photos:
  - src: /images/kitchen/kitchen-3x-staff-serving.png
    alt: Oakdene Kitchen volunteers with prepared food
  - src: /images/kitchen/oakdene-kitchen-community-table.png
