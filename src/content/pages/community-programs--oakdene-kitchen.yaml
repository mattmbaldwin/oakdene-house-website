how:
  heading:
    eyebrow: Your First Visit
    heading: How it works
  intro: On your first visit, one of our team members will sit down with you to find out more about your situation and needs so we can understand how to support you best.
  eligibility:
    heading: Eligibility
    items:
      - Current Centrelink statement showing total income below $1,200 per fortnight, including any other subsidies or rental support shown on the statement
      - Proof of ID with photo-based evidence (driver's licence, passport, etc.)
      - Updated statement to be provided monthly showing any changes to income or benefits
  note:
    heading: Important note
    text: If you choose to use Oakdene Kitchen support, you will no longer be able to be a member of Fairfield RSL.
  guidelines:
    heading: Community guidelines
    text: We ask that you treat others with respect. Aggressive or abusive behaviour is not accepted. Staff may refuse entry if guidelines are not followed.
volunteer:
  image:
    src: /images/volunteers/oakdene-volunteer-kitchen-2.png
    alt: Oakdene Kitchen volunteer
  heading:
    eyebrow: Get Involved
    heading: Volunteer with the Kitchen
  paragraphs:
    - We are always looking for volunteers to help us run the Kitchen. Whether it is helping prepare food, serving meals, or providing a friendly presence — every contribution makes a real difference.
    - If you would like to get involved, please get in touch.
