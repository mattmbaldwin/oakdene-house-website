# Words and images for /community-programs/volunteering/. Layout: src/pages/community-programs/volunteering/index.astro.
# The application form is a Jotform and is not here.
layout: volunteering
seo:
  title: Volunteering — Oakdene House Foundation
  description: Volunteer with Oakdene House Foundation in Fairfield, Western Sydney. Community and corporate volunteering opportunities available.
  image: /images/volunteers/oakdene-volunteer-kitchen-1.png
hero:
  breadcrumb: Volunteering
  heading: Volunteer with Oakdene House Foundation
  lead: Volunteers play an important role at Oakdene House. They help create a welcoming environment, support practical programs and strengthen our connection to the community.
why:
  heading:
    eyebrow: Why Volunteer
    heading: Make a real contribution
  paragraph: Volunteering at Oakdene is practical, welcoming, and meaningful. Every volunteer who walks through our doors becomes part of a community that is working to make a genuine difference.
  reasons:
    - Be part of a local charity making a practical difference
    - Support people and families in your community
    - Join a welcoming, values-led environment
    - Use your time and skills in ways that matter
  button:
    label: Apply to Volunteer
    href: "#volunteer-form"
  image:
    src: /images/kitchen/oakdene-kitchen-interior-with-food-stacks.jpg
    alt: Volunteer at Oakdene Kitchen serving food
types:
  heading:
    eyebrow: How You Can Volunteer
    heading: Two ways to get involved
  learnMoreLabel: Learn More
  cards:
    - heading: Community Volunteering
      description: Join our day-to-day operations — supporting the Kitchen, Boutique, Laundrette, and programs. Open to individuals who want to make a direct local contribution.
      href: /community-programs/volunteering/community-volunteers/
      image:
        src: /images/volunteers/oakdene-volunteer-kitchen-2.png
        alt: Volunteer serving food at Oakdene Kitchen
    - heading: Corporate Volunteering
      description: Bring your team to Oakdene for structured volunteering days or partnership programs. A meaningful way to give back and build team purpose.
      href: /community-programs/volunteering/corporate-volunteering/
      image:
        src: /images/volunteers/oakdene-volunteer-kitchen-3.png
        alt: Volunteers at Oakdene wrapping food
expect:
  heading:
    eyebrow: What to Expect
    heading: Volunteering at Oakdene
  steps:
    - heading: Apply
      body: Submit a volunteer application through our form or contact us directly.
    - heading: Meet the team
      body: We will have a brief conversation to understand your availability and interests.
    - heading: Get started
      body: You will be welcomed into your role with support and guidance from our team.
    - heading: Make a difference
      body: Your time and energy directly support people and families in the Fairfield community.
form:
  heading: Apply to volunteer
  intro: We'd love to hear from you. Fill in the form below and we'll get back to you within 2 business days to arrange a quick conversation about your interests and availability. You don't need prior experience — we value willingness, reliability, and a caring approach more than anything else.
cta:
  heading: Ready to get involved?
  primary:
    label: Apply to Volunteer
    href: "#volunteer-form"
  secondary:
    label: Partnership Enquiry
    href: /contact/
