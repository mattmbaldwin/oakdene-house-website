# Words and images for /services/outpatients-program/. Layout: src/pages/services/outpatients-program.astro.
# The icon on each "Our approach" card is picked here; the icons themselves stay in the page.
layout: outpatients-program
seo:
  title: Outpatients Program — Oakdene House Foundation
  description: Structured rehabilitation support at Oakdene House — counselling, group sessions, 12-step and peer support, delivered by accredited AOD and mental health counsellors. Free.
  image: /images/centre/interior-img_2655.jpg
hero:
  breadcrumb: Outpatients Program
  heading: Outpatients Program
  lead: A structured rehabilitation program committed to recovery.
overview:
  heading:
    eyebrow: About the Program
    heading: Structured support for recovery
  paragraphs:
    - The Outpatients Program is designed for people looking for structured rehabilitation support while maintaining their living situation. Our experienced counsellors provide comprehensive, evidence-based support focused on recovery and wellbeing.
    - All support is delivered by accredited AOD (Alcohol and Other Drugs) and mental health counsellors, and is completely free of charge.
  offerHeading: What we offer
  offerings:
    - One-on-one counselling
    - Group sessions
    - 12-step support
    - Peer support
    - All delivered by accredited AOD and mental health counsellors
    - All services are free
  image:
    src: /images/centre/interior-interior-2-img_2656-with-people.png
    alt: Support space inside Oakdene House
  contact:
    heading: Get in touch
    phone:
      label: (02) 8717 0999
      href: tel:0287170999
    email:
      label: admin@oakdenehouse.org.au
      href: mailto:admin@oakdenehouse.org.au
    button:
      label: Get Support
      href: /contact/
      style: primary
approach:
  heading:
    eyebrow: Our Approach
    heading: Recovery on your terms
  items:
    - icon: shield
      heading: Evidence-based
      body: All counselling and group work is grounded in proven, accredited practice for addiction and recovery.
    - icon: people
      heading: Community-centred
      body: You stay in your home and community. Peer connection is built alongside professional support.
    - icon: clock
      heading: Flexible timing
      body: The program is structured but designed to work around the reality of your life — not the other way around.
cta:
  heading: Ready to take the next step?
  primary:
    label: Get Support
    href: /contact/
  secondary:
    label: Contact Us
    href: /contact/
