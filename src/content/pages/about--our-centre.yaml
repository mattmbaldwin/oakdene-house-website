layout: our-centre
seo:
  title: Our Centre — Oakdene House Foundation
  description: Oakdene House is a safe, welcoming and practical space in Fairfield, Western Sydney bringing together counselling rooms, group spaces and community services all in one place.
  image: /images/centre/exterior-exterior-1-img_2651.jpg
hero:
  breadcrumb: Our Centre
  heading: Our Centre
  lead: A safe, welcoming and practical space in Fairfield where people can access help in one place.
intro:
  heading:
    eyebrow: The Space
    heading: A space built around people
  paragraphs:
    - Oakdene House is designed to be a safe, welcoming and practical space for people seeking support. Our centre brings together counselling rooms, group spaces and community service areas so people can access help in one place.
  expectHeading: What visitors can expect
  expectItems:
    - A warm and respectful environment
    - Private spaces for individual support
    - Group areas for programs and peer connection
    - Community service areas including the kitchen, laundrette and boutique
  image:
    src: /images/centre/interior-img_2655-with-people.png
    alt: Inside Oakdene House Foundation centre
