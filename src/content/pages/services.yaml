# Words and images for /services/. Layout: src/pages/services.astro.
# The icon on each card is picked here; the icons themselves stay in the page.
layout: services
seo:
  title: Services — Oakdene House Foundation
  description: Oakdene House Foundation offers counselling, practical support, community programs and referral pathways for people experiencing hardship in Fairfield, Western Sydney.
  image: /images/centre/interior-img_2655-with-people.png
hero:
  heading: Addiction support that meets people where they are
  lead: Oakdene provides structured addiction support — counselling, group programs, peer meetings, and financial guidance — for people working through gambling, alcohol, and other dependencies. **Our team specialises in gambling and alcohol dependency, with experienced counsellors trained in these areas.**
  button:
    label: Get Support
    href: /contact/
    style: white
categories:
  heading:
    eyebrow: What We Offer
    heading: Seven services across the recovery journey
    lead: From individual counselling to peer support and financial guidance — the full spectrum of addiction recovery in one place.
  items:
    - icon: heart
      heading: Counselling & One-on-One Support
      body: Person-centred support that helps people talk through challenges, make sense of what is happening, and identify the next step.
    - icon: people
      heading: Group & Recovery Programs
      body: Structured group programs that build accountability, coping skills, and peer connection across the recovery journey.
    - icon: arrow
      heading: Referral Pathways
      body: Help connecting with the right services when more specialised or longer-term support is needed.
services:
  heading:
    eyebrow: All Services
    heading: Everything we offer
  items:
    - title: Life Choices Program
      summary: A 6-week group program covering addiction, coping strategies, life skills and peer connection.
      href: /services/life-choices-program/
      eyebrow: Community-Based Support
      image:
        src: /images/centre/outside-meeting.png
        alt: Group meeting room at Oakdene House
    - title: Group DBT Therapy
      summary: Practical, evidence-based skills for managing emotions, relationships, and difficult moments.
      href: /services/group-dbt-therapy/
      eyebrow: Counselling and Support
      image:
        src: /images/dbt/dbt-hero-photo.png
        alt: Group meeting room at Oakdene House
    - title: Outpatients Program
      summary: Structured rehabilitation with counselling, group sessions, 12-step support and peer mentoring.
      href: /services/outpatients-program/
      eyebrow: Counselling and Support
      image:
        src: /images/centre/interior-img_2655-with-people.png
        alt: Interior support space at Oakdene House
    - title: Individual Counselling
      summary: Confidential one-on-one counselling for people affected by addiction and related challenges.
      href: /services/individual-counselling/
      eyebrow: Counselling and Support
      image:
        src: /images/centre/interior-interior-2-img_2656-with-people.png
        alt: Individual counselling space at Oakdene House
    - title: Gambling Counselling
      summary: Free, confidential gambling counselling provided by Catholic Care — by appointment.
      href: /services/gambling-counselling/
      eyebrow: Counselling and Support
      image:
        src: /images/generic/colour-distressed-woman.png
        alt: Person seeking support — gambling counselling
    - title: AA & GA Meetings
      summary: Alcoholics Anonymous and Gamblers Anonymous meetings, including Spanish-speaking sessions.
      href: /services/aa-ga-meetings/
      eyebrow: Community-Based Support
      image:
        src: /images/centre/interior-meetings-1-img_2657-v2.png
        alt: Meeting room at Oakdene House
    - title: Financial Counselling
      summary: Free guidance for people experiencing financial hardship — managing debt, bills and planning ahead.
      href: /services/financial-counselling/
      eyebrow: Referral Pathways
      image:
        src: /images/generic/colour-business-man_distress.png
        alt: Person experiencing financial stress
steps:
  heading:
    eyebrow: Getting Started
    heading: How to get started
    lead: Accessing support at Oakdene is straightforward. Here is what to expect.
  items:
    - heading: Make Contact
      body: Reach out by phone, email, form, or in person.
    - heading: Share Your Story
      body: Tell us what is happening and what kind of help you are looking for.
    - heading: Get Connected
      body: We review your enquiry and work out the most helpful next step.
    - heading: Move Forward
      body: You are connected with direct support, a program, referral, or a mix of these.
who:
  heading:
    eyebrow: Who We Support
    heading: You don't need to meet specific criteria
  paragraphs:
    - Oakdene supports individuals, families, carers, and community members looking for practical help, guidance, connection, or referral support. This includes people affected by addiction, hardship, homelessness, social isolation, or other major life pressures.
    - You do not need to meet specific criteria. If you are going through a tough time and need support, we are here.
  button:
    label: Get Support
    href: /contact/
    style: primary
cta:
  heading: We are here to help
  primary:
    label: Get Support
    href: /contact/
  secondary:
    label: Contact Us
    href: /contact/
