hero:
  breadcrumb: Oakdene's Story
  heading: Oakdene's Story
  lead: A story of hardship, endurance and healing — rooted in Fairfield since 1842.
story:
  heading:
    eyebrow: The Oak
    heading: A tree that endured
  paragraphs:
    - The Oakdene is an evergreen Holm Oak in Fairfield, planted in 1842. During
      a storm, the tree was split down the middle by lightning. It is visibly
      divided into two parts, but continues to grow evergreen. The story of the
      Oakdene is one of hardship, endurance and healing. It shows that difficult
      times and broken pasts can be overcome, and that we can all continue to
      grow.
    - Oakdene House was built on a simple idea — that people facing addiction,
      hardship and social disconnection deserve a place where they can be
      welcomed, supported and treated with dignity.
    - Over time, Oakdene has grown into a community hub that blends professional
      support with practical care. What began as a place of help has become a
      place of belonging for many people who need stability, encouragement and a
      pathway forward.
    - Today, Oakdene House supports individuals and families through addiction
      services, counselling, group programs and community-based supports. Our
      work reflects the needs of the local community and continues to evolve
      through partnership, listening and lived experience.
  image:
    src: /images/about/oakdene-tree-sunlight.jpg
    alt: Sunlight through the leaves of the Oakdene tree in Fairfield
