  - name: faqs
    label: FAQs
    format: yaml
    editor:
      preview: false
    files:
      - name: faqs
        label: FAQs
        file: src/content/faqs.yaml
        fields:
          - name: sections
            label: FAQ page sections
            widget: list
            summary: "{{fields.heading}}"
            label_singular: Section
            fields:
              - name: id
                label: Section id
                hint: Lower-case letters, digits or hyphens. FAQs refer to it.
                widget: string
                pattern:
                  - ^[a-z][a-z0-9-]*$
                  - Must match ^[a-z][a-z0-9-]*$
              - name: heading
                label: Heading
                hint: The section heading on the FAQ page.
                widget: string
          - name: faqs
            label: Questions
            widget: list
            summary: "{{fields.question}}"
            label_singular: FAQ
            fields:
              - name: question
                label: Question
                widget: string
              - name: answer
                label: Answer
                hint: Bold, italic and links only. Press Shift+Enter for a line break, not Enter.
                widget: markdown
                buttons:
                  - bold
                  - italic
                  - link
                editor_components: []
              - name: section
                label: Section id
                hint: One of the section ids above, e.g. "general".
                widget: string
              - name: showOnFaqPage
                label: Show on the FAQ page
                widget: boolean
                default: false
              - name: showOnHome
                label: Show on the home page
                widget: boolean
                default: false
              - name: order
                label: Order
                hint: Lower numbers show first, within a section and on the home page.
                widget: number
                value_type: int
